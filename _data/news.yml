# Newest first. `text` is Markdown.
- date: 10/2026
  text: >-
    Wrapped up a 3-month internship project at Google in Bangalore, India.
    Many crucial learnings and an overall enriching experience!

- date: 08/2026
  text: >-
    Fact, not fib! Our [MF<sup>2</sup> work](/research.html#publications), now
    titled "How Well Do Vision-Language Models Understand Movies?", is accepted
    to [EMNLP 2026](https://2026.emnlp.org/)!

- date: 01/2026
  text: >-
    Pre-trained multimodal models are increasingly being used in many practical
    applications involving language generation from temporally-ordered events.
    But do they have the fundamental ability to recognize salient sub-events in
    such events? We investigate this and discuss the findings in our
    [latest preprint](/research.html#publications)!

- date: 06/2025
  text: >-
    What reasoning skills are needed to understand long videos? Can multimodal
    AI models comprehend movies like humans do? Or are they biased toward one
    modality? We explore these questions and release a new benchmark:
    [MF<sup>2</sup>](/research.html#publications)!

- date: 05/2025
  text: >-
    [Our work](https://arxiv.org/pdf/2406.18403) "LLMs instead of Human Judges?
    A Large Scale Empirical Study across 20 NLP Evaluation Tasks" is accepted
    to the ACL 2025 main conference
    ([more details](https://x.com/alberto_testoni/status/1807775204023664667))!

- date: 03/2025
  text: >-
